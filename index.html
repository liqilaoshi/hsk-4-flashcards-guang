<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 4 级全量词汇闪卡</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 8px 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-fill {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            min-height: 380px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 380px;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-radius: 16px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 24px;
            box-sizing: border-box;
        }

        .card-front {
            font-size: 4rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-front .hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 20px;
            font-weight: normal;
        }

        .card-back {
            transform: rotateY(180deg);
            justify-content: space-between;
        }

        .word-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .pinyin {
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meaning {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-top: 4px;
            font-weight: 500;
        }

        .audio-btn {
            background: #f1f5f9;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 10px;
            border-radius: 20px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--primary-color);
            font-weight: 600;
        }

        .audio-btn:hover {
            background-color: #e2e8f0;
        }

        .example-box {
            width: 100%;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            box-sizing: border-box;
            border-left: 4px solid var(--primary-color);
            text-align: left;
            margin-top: 15px;
        }

        .example-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .example-hanzi {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
            line-height: 1.4;
        }

        .example-pinyin {
            font-size: 0.95rem;
            color: var(--primary-color);
            margin: 4px 0;
        }

        .example-trans {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 16px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn-dont-know {
            background-color: #fee2e2;
            color: var(--accent-red);
        }
        .btn-dont-know:hover { background-color: #fecaca; }

        .btn-know {
            background-color: #dcfce7;
            color: var(--accent-green);
        }
        .btn-know:hover { background-color: #bbf7d0; }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
        }

        .btn-nav {
            background-color: #e2e8f0;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .btn-nav:hover { background-color: #cbd5e1; }

        .wrong-section {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            box-sizing: border-box;
        }

        .wrong-section h3 {
            margin-top: 0;
            color: var(--accent-red);
            font-size: 1.1rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wrong-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }

        .wrong-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #f8fafc;
            font-size: 0.92rem;
        }

        .wrong-item:hover { background-color: #f8fafc; }
        .wrong-item span { cursor: pointer; }

        .remove-wrong {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .remove-wrong:hover { color: var(--accent-red); }

        .empty-tip {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <header>

    <div class="container">

            </div>
        </div>

        <div class="controls">

            <button class="btn btn-know" onclick="markCorrect()">✔️ 认识</button>
        </div>

        <div class="nav-controls">
            <button class="btn-nav" onclick="prevCard()">⬅️ 上一个</button>
            <button class="btn-nav" onclick="nextCard()">下一个 ➡️</button>
        </div>

        <div class="wrong-section">

            <ul class="wrong-list" id="wrongList">

            </ul>
        </div>
    </div>

        ];

        let currentIndex = 0;
        let wrongWords = JSON.parse(localStorage.getItem('hsk4_wrong_words')) || [];

        const cardEl = document.getElementById('card');
        const hanziEl = document.getElementById('card-hanzi');
        const pinyinEl = document.getElementById('card-pinyin');
        const meaningEl = document.getElementById('card-meaning');
        const exampleEl = document.getElementById('card-example');
        const examplePinyinEl = document.getElementById('card-example-pinyin');
        const exampleTransEl = document.getElementById('card-example-trans');
        const counterEl = document.getElementById('counter');
        const progressEl = document.getElementById('progress');
        const wrongListEl = document.getElementById('wrongList');
        const wrongCountEl = document.getElementById('wrong-count');

        function updateCard() {
            const item = vocabData[currentIndex];
            hanziEl.textContent = item.hanzi;
            pinyinEl.textContent = item.pinyin;
            meaningEl.textContent = item.meaning;
            exampleEl.textContent = item.example;
            examplePinyinEl.textContent = item.examplePinyin;
            exampleTransEl.textContent = item.exampleTranslation;

            counterEl.textContent = `词语 ${currentIndex + 1} / ${vocabData.length}`;
            progressEl.style.width = `${((currentIndex + 1) / vocabData.length) * 100}%`;

            cardEl.classList.remove('flipped');
        }

        function flipCard() {
            cardEl.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < vocabData.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                alert('🎉 恭喜您已复习完所有 469 个 HSK 4 词汇！');
                currentIndex = 0;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function markCorrect() {
            nextCard();
        }

        function markWrong() {
            const item = vocabData[currentIndex];
            const exists = wrongWords.some(w => w.hanzi === item.hanzi);
            if (!exists) {
                wrongWords.push(item);
                saveAndRenderWrongList();
            }
            nextCard();
        }

        function removeWrong(index, event) {
            event.stopPropagation();
            wrongWords.splice(index, 1);
            saveAndRenderWrongList();
        }

        function saveAndRenderWrongList() {
            localStorage.setItem('hsk4_wrong_words', JSON.stringify(wrongWords));
            wrongCountEl.textContent = `${wrongWords.length} 个词`;
            
            if (wrongWords.length === 0) {
                wrongListEl.innerHTML = `<div class="empty-tip">暂无错词，继续加油！💪</div>`;
                return;
            }

            wrongListEl.innerHTML = '';
            wrongWords.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'wrong-item';
                li.innerHTML = `
                    <span onclick="jumpToWord('${item.hanzi}')"><strong>${item.hanzi}</strong> (${item.pinyin}) - ${item.meaning}</span>
                    <button class="remove-wrong" onclick="removeWrong(${index}, event)">移出</button>
                `;
                wrongListEl.appendChild(li);
            });
        }

        function jumpToWord(hanzi) {
            const index = vocabData.findIndex(item => item.hanzi === hanzi);
            if (index !== -1) {
                currentIndex = index;
                updateCard();
            }
        }

        function playAudio(type) {
            const item = vocabData[currentIndex];
            const textToSpeak = type === 'word' ? item.hanzi : item.example;
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.88;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音朗读功能');
            }
        }

        // 初始化加载
        updateCard();
        saveAndRenderWrongList();
    </script>
