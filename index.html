<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 4 级词汇与例句智能复习闪卡</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --sentence-bg: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 8px 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 闪卡 3D 容器 - 适当增加高度以容纳例句 */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 380px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-radius: 16px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 24px;
            box-sizing: border-box;
        }

        .card-front {
            font-size: 4.5rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-front .hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 20px;
            font-weight: normal;
        }

        .card-back {
            transform: rotateY(180deg);
            justify-content: space-between;
        }

        .word-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .pinyin {
            font-size: 1.6rem;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .meaning {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* 新增例句样式 */
        .sentence-box {
            background-color: var(--sentence-bg);
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            padding: 12px 16px;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
            margin-top: 10px;
        }

        .sentence-zh {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .sentence-py {
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .sentence-en {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* 语音按钮 */
        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .audio-btn:hover {
            background-color: #e2e8f0;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 16px;
            width: 100%;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn-dont-know {
            background-color: #fee2e2;
            color: var(--accent-red);
        }
        .btn-dont-know:hover {
            background-color: #fecaca;
        }

        .btn-know {
            background-color: #dcfce7;
            color: var(--accent-green);
        }
        .btn-know:hover {
            background-color: #bbf7d0;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 30px;
        }

        .btn-nav {
            background-color: #e2e8f0;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-nav:hover {
            background-color: #cbd5e1;
        }

        /* 错词本 */
        .wrong-section {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            box-sizing: border-box;
        }

        .wrong-section h3 {
            margin-top: 0;
            color: var(--accent-red);
            font-size: 1.1rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wrong-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .wrong-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #f8fafc;
            font-size: 0.95rem;
        }

        .wrong-item:hover {
            background-color: #f8fafc;
        }

        .remove-wrong {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .remove-wrong:hover {
            color: var(--accent-red);
        }

        .empty-tip {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>HSK 4 词汇与例句复习闪卡</h1>
        <p>支持带声调拼音例句、英文翻译与语音朗读</p>
    </header>

    <div class="container">
        <div class="stats">
            <span id="counter">词语 1 / 469</span>
            <span id="mode-indicator">全部词汇复习</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <!-- 闪卡主体 -->
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="card">
                <div class="card-face card-front">
                    <span id="card-hanzi">阴</span>
                    <div class="hint">点击卡片查看拼音、词义与例句</div>
                </div>
                <div class="card-face card-back">
                    <div class="word-header">
                        <div class="pinyin">
                            <span id="card-pinyin">yīn</span>
                            <button class="audio-btn" onclick="event.stopPropagation(); playAudio()" title="播放词汇和例句发音">🔊</button>
                        </div>
                        <div class="meaning" id="card-meaning">Overcast / Cloudy</div>
                    </div>

                    <!-- 例句显示块 -->
                    <div class="sentence-box">
                        <div class="sentence-zh" id="sentence-zh">今天是阴天。</div>
                        <div class="sentence-py" id="sentence-py">Jīntiān shì yīntiān.</div>
                        <div class="sentence-en" id="sentence-en">Today is an overcast day.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 自测操作按钮 -->
        <div class="controls">
            <button class="btn btn-dont-know" onclick="markWrong()">❌ 不会</button>
            <button class="btn btn-know" onclick="markCorrect()">✔️ 认识</button>
        </div>

        <!-- 导航按钮 -->
        <div class="nav-controls">
            <button class="btn-nav" onclick="prevCard()">⬅️ 上一个</button>
            <button class="btn-nav" onclick="nextCard()">下一个 ➡️</button>
        </div>

        <!-- 错词本展示区 -->
        <div class="wrong-section">
            <h3>
                <span>📌 我的错词本 (“不会”的词)</span>
                <span id="wrong-count" style="font-size: 0.85rem; color: var(--text-muted);">0 个词</span>
            </h3>
            <ul class="wrong-list" id="wrongList">
                <div class="empty-tip">暂无错词，继续保持！💪</div>
            </ul>
        </div>
    </div>

    <script>
        // 包含词汇、拼音、英译及示例例句（中英+声调拼音）的数据集
        const vocabData = [
            {
                hanzi: "阴", pinyin: "yīn", meaning: "Overcast / Cloudy",
                exZh: "今天是阴天，可能会下雨。",
                exPy: "Jīntiān shì yīntiān, kěnéng huì xià yǔ.",
                exEn: "Today is cloudy, it might rain."
            },
            {
                hanzi: "运动", pinyin: "yùndòng", meaning: "Sports / Exercise",
                exZh: "我每天早上都坚持运动。",
                exPy: "Wǒ měitiān zǎoshang dōu jiānchí yùndòng.",
                exEn: "I insist on exercising every morning."
            },
            {
                hanzi: "丈夫", pinyin: "zhàngfu", meaning: "Husband",
                exZh: "她的丈夫是一名医生。",
                exPy: "Tā de zhàngfu shì yī míng yīshēng.",
                exEn: "Her husband is a doctor."
            },
            {
                hanzi: "安排", pinyin: "ānpái", meaning: "To arrange / Plan",
                exZh: "经理正在安排明天的会议。",
                exPy: "Jīnglǐ zhèngzài ānpái míngtiān de huìyì.",
                exEn: "The manager is arranging tomorrow's meeting."
            },
            {
                hanzi: "保证", pinyin: "bǎozhèng", meaning: "To guarantee",
                exZh: "我保证按时完成这份工作。",
                exPy: "Wǒ bǎozhèng ànshí wánchéng zhè fèn gōngzuò.",
                exEn: "I guarantee to finish this work on time."
            },
            {
                hanzi: "抱歉", pinyin: "bàoqiàn", meaning: "To feel sorry / Apologize",
                exZh: "真的很抱歉，我迟到了。",
                exPy: "Zhēn de hěn bàoqiàn, wǒ chídào le.",
                exEn: "I am really sorry for being late."
            },
            {
                hanzi: "成功", pinyin: "chénggōng", meaning: "Success / To succeed",
                exZh: "只要努力，就一定会成功。",
                exPy: "Zhǐyào nǔlì, jiù yīdìng huì chénggōng.",
                exEn: "As long as you work hard, you will definitely succeed."
            },
            {
                hanzi: "仔细", pinyin: "zǐxì", meaning: "Careful / Meticulous",
                exZh: "请仔细检查你的考试卷子。",
                exPy: "Qǐng zǐxì jiǎnchá nǐ de kǎoshì juǎnzi.",
                exEn: "Please carefully check your exam paper."
            }
            // 提示：完整 469 词均支持扩展相同结构的例句字段 (exZh, exPy, exEn)
        ];

        let currentIndex = 0;
        let wrongWords = JSON.parse(localStorage.getItem('hsk4_wrong_words_v2')) || [];

        const cardEl = document.getElementById('card');
        const hanziEl = document.getElementById('card-hanzi');
        const pinyinEl = document.getElementById('card-pinyin');
        const meaningEl = document.getElementById('card-meaning');
        const exZhEl = document.getElementById('sentence-zh');
        const exPyEl = document.getElementById('sentence-py');
        const exEnEl = document.getElementById('sentence-en');

        const counterEl = document.getElementById('counter');
        const progressEl = document.getElementById('progress');
        const wrongListEl = document.getElementById('wrongList');
        const wrongCountEl = document.getElementById('wrong-count');

        function updateCard() {
            const currentItem = vocabData[currentIndex];
            hanziEl.textContent = currentItem.hanzi;
            pinyinEl.textContent = currentItem.pinyin;
            meaningEl.textContent = currentItem.meaning;

            exZhEl.textContent = currentItem.exZh || "暂无例句";
            exPyEl.textContent = currentItem.exPy || "";
            exEnEl.textContent = currentItem.exEn || "";

            counterEl.textContent = `词语 ${currentIndex + 1} / ${vocabData.length}`;
            progressEl.style.width = `${((currentIndex + 1) / vocabData.length) * 100}%`;

            cardEl.classList.remove('flipped');
        }

        function flipCard() {
            cardEl.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < vocabData.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                alert('🎉 恭喜你已经完成本轮复习！');
                currentIndex = 0;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function markCorrect() {
            nextCard();
        }

        function markWrong() {
            const currentItem = vocabData[currentIndex];
            const exists = wrongWords.some(item => item.hanzi === currentItem.hanzi);
            if (!exists) {
                wrongWords.push(currentItem);
                saveAndRenderWrongList();
            }
            nextCard();
        }

        function removeWrong(index, event) {
            event.stopPropagation();
            wrongWords.splice(index, 1);
            saveAndRenderWrongList();
        }

        function saveAndRenderWrongList() {
            localStorage.setItem('hsk4_wrong_words_v2', JSON.stringify(wrongWords));
            wrongCountEl.textContent = `${wrongWords.length} 个词`;
            
            if (wrongWords.length === 0) {
                wrongListEl.innerHTML = `<div class="empty-tip">暂无错词，继续保持！💪</div>`;
                return;
            }

            wrongListEl.innerHTML = '';
            wrongWords.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'wrong-item';
                li.innerHTML = `
                    <span onclick="jumpToWord('${item.hanzi}')"><strong>${item.hanzi}</strong> (${item.pinyin}) - ${item.meaning}</span>
                    <button class="remove-wrong" onclick="removeWrong(${index}, event)">移出</button>
                `;
                wrongListEl.appendChild(li);
            });
        }

        function jumpToWord(hanzi) {
            const index = vocabData.findIndex(item => item.hanzi === hanzi);
            if (index !== -1) {
                currentIndex = index;
                updateCard();
            }
        }

        // 顺序朗读词汇及例句
        function playAudio() {
            const currentItem = vocabData[currentIndex];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                // 朗读词汇 + 朗读例句
                const textToRead = `${currentItem.hanzi}。例句：${currentItem.exZh || ''}`;
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.85; // 语速调至 0.85，发音清晰
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音朗读功能');
            }
        }

        // 初始化
        updateCard();
        saveAndRenderWrongList();
    </script>
</body>
</html>
